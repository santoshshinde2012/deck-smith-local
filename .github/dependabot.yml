# One grouped PR per ecosystem per month, so the PR list stays short. Majors are grouped too;
# CI (including stack-e2e) decides whether a group can merge.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    groups:
      python-deps: { patterns: ["*"] }
    commit-message: { prefix: "chore(deps)" }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    groups:
      github-actions: { patterns: ["*"] }
    commit-message: { prefix: "ci(deps)" }
  - package-ecosystem: docker
    directories: [/docker/agent, /docker/mlflow]
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    groups:
      docker-images: { patterns: ["*"] }
    ignore:
      # Python 3.14 images are deferred (tested in #5/#7): the MLflow image cannot build because the
      # pinned psycopg2-binary 2.9.10 has no 3.14 wheel, and trivy fails the 3.14 agent image on a
      # fixable HIGH (msgpack 1.1.2, GHSA-6v7p-g79w-8964). CI tests 3.11-3.13. See CHANGELOG.
      - dependency-name: python
        versions: [">=3.14"]
    commit-message: { prefix: "chore(deps)" }
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    groups:
      compose-images: { patterns: ["*"] }
    commit-message: { prefix: "chore(deps)" }
