name: release
# Semantic versioning from Conventional Commits: release-please opens a release PR that bumps
# pyproject.toml and CHANGELOG.md; merging it tags vX.Y.Z, creates the GitHub release and attaches
# the wheel, sdist and SBOM.
on:
  push: { branches: [main] }
permissions: { contents: write, pull-requests: write }
jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with: { config-file: release-please-config.json, manifest-file: .release-please-manifest.json }

  publish-artifacts:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ needs.release-please.outputs.tag }}" }
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - run: uv build
      - run: uv sync --locked --no-dev && uvx --from cyclonedx-bom cyclonedx-py environment .venv/bin/python -o dist/sbom.cdx.json
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release upload "${{ needs.release-please.outputs.tag }}" dist/* --clobber
