name: supply-chain
on:
  push: { branches: [main] }
  pull_request:
    paths: ["docker/**", "pyproject.toml", "uv.lock", "docker-compose.yml", ".github/workflows/supply-chain.yml"]
  schedule: [{ cron: "41 4 * * 1" }]
permissions: { contents: read }
jobs:
  hadolint:
    runs-on: ubuntu-latest
    strategy:
      matrix: { dockerfile: [docker/agent/Dockerfile, docker/mlflow/Dockerfile] }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with: { dockerfile: "${{ matrix.dockerfile }}", failure-threshold: warning }

  images:
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write }
    strategy:
      matrix:
        include:
          - { name: agent, context: ., file: docker/agent/Dockerfile }
          - { name: mlflow, context: docker/mlflow, file: docker/mlflow/Dockerfile }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: build
        run: docker build -t decksmith-${{ matrix.name }}:ci -f ${{ matrix.file }} ${{ matrix.context }}
      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: decksmith-${{ matrix.name }}:ci
          format: cyclonedx-json
          output-file: sbom-${{ matrix.name }}.cdx.json
          upload-artifact: true
      - name: trivy (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: decksmith-${{ matrix.name }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
      - name: trivy (SARIF to code scanning)
        if: always() && github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: decksmith-${{ matrix.name }}:ci
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          exit-code: "0"
      - if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with: { sarif_file: "trivy-${{ matrix.name }}.sarif", category: "trivy-${{ matrix.name }}" }
