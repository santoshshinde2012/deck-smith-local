name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix: { python: ["3.11", "3.12", "3.13"] }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with: { python-version: "${{ matrix.python }}", enable-cache: true }
      - name: install (locked)
        run: uv sync --locked --all-extras
      - name: ruff
        run: uv run ruff check src tests scripts && uv run ruff format --check src tests scripts
      - name: mypy
        run: uv run mypy
      - name: tests with coverage gate (unit, contract, architecture, integration, e2e E1-E8)
        run: uv run pytest -rs
      - name: golden set
        run: uv run python -m decksmith.seed.generate && uv run python -m decksmith.evaluation.harness
      - name: dependency audit
        run: uv export --frozen --all-extras --no-emit-project --no-hashes -o "$RUNNER_TEMP/req.txt" && uv run pip-audit --strict --progress-spinner off --disable-pip --no-deps -r "$RUNNER_TEMP/req.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.python == '3.12'
        with: { name: coverage, path: coverage.xml }

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: validate docker-compose.yml (all profiles)
        run: docker compose --profile core --profile app --profile instabox config --quiet

  docs:
    # Markdown style, and the diagrams: shared palette, committed images up to date, every source renders.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: markdownlint
        run: npx -y markdownlint-cli2@0.23.3 "**/*.md"
      - name: diagrams are fresh (sources, rules, committed images)
        run: python3 scripts/diagrams.py --check
      - name: diagrams render (mermaid-cli)
        env:
          MMDC: npx -y @mermaid-js/mermaid-cli@11.4.2
          PUPPETEER_CONFIG: ${{ runner.temp }}/puppeteer.json
        run: echo '{"args":["--no-sandbox"]}' > "$PUPPETEER_CONFIG" && python3 scripts/diagrams.py --check --render

  stack-e2e:
    # The same lean profile InstaBox uses, on a GitHub runner: real Postgres, MLflow, Portkey, agent image.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with: { python-version: "3.12", enable-cache: true }
      - run: uv sync --locked --all-extras && cp .env.instabox .env
      - run: make seed PY=.venv/bin/python
      - run: make up-instabox
      - run: make e2e-stack PY=.venv/bin/python
      - run: make smoke-api
      - run: make demo PY=.venv/bin/python
      - name: use case end to end (containerised API and UI)
        run: make e2e-usecase PY=.venv/bin/python && curl -fsS http://localhost:8501/_stcore/health
      - if: failure()
        run: docker compose --profile instabox logs --tail 200
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: { name: stack-e2e, path: "out/*.xml\nout/*.md" }

  quickstart-offline:
    # What a newcomer runs first: no Docker, fake LLM, DuckDB; then the scripted use case.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with: { python-version: "3.12", enable-cache: true }
      - run: make quickstart-offline
      - run: make e2e-usecase
      - run: make stop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: { name: quickstart-offline, path: "out/e2e-usecase.md\nout/usecase-*.pptx\nout/logs/" }
