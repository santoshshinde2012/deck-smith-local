name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix: { python: ["3.11", "3.12"] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}", cache: pip }
      - run: python -m pip install -U pip && pip install -e ".[dev]"
      - name: ruff
        run: ruff check src tests scripts && ruff format --check src tests scripts
      - name: mypy
        run: mypy
      - name: unit + architecture + integration
        run: pytest -m "not e2e" -rs
      - name: e2e (E1-E8, fake LLM, no keys)
        run: pytest -m e2e -rs
      - name: golden set
        run: python -m decksmith.evaluation.harness

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: validate docker-compose.yml
        run: cp .env.example .env && docker compose --profile core --profile app config --quiet
