# DeckSmith local stack. Profiles:
#   core : Postgres (checkpoints + MLflow store), MLflow 3, Unity Catalog OSS, Portkey OSS gateway, RustFS (S3)
#   app  : the agent API and the Streamlit UI in containers (optional; `make api` / `make ui` run them natively)
# Ollama runs natively on the Mac (Metal GPU), not in Docker. Spark and Airflow profiles come in a later phase.
name: decksmith-local

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    <<: *restart
    profiles: ["core"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: decksmith
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-decksmith}
      POSTGRES_DB: decksmith
    ports: ["5433:5432"]
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U decksmith -d decksmith"]
      interval: 5s
      timeout: 3s
      retries: 20

  mlflow:
    <<: *restart
    profiles: ["core"]
    build: ./docker/mlflow
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql+psycopg2://decksmith:${POSTGRES_PASSWORD:-decksmith}@postgres:5432/mlflow
      --artifacts-destination /mlartifacts --serve-artifacts
    ports: ["5001:5000"]          # 5000 is taken by AirPlay Receiver on macOS
    volumes: [mlflow-artifacts:/mlartifacts]
    depends_on:
      postgres: { condition: service_healthy }

  unitycatalog:
    <<: *restart
    profiles: ["core"]
    image: unitycatalog/unitycatalog:v0.7.0
    ports: ["8081:8080"]          # host 8080 is kept for Airflow in a later profile

  portkey:
    <<: *restart
    profiles: ["core"]
    image: portkeyai/gateway:1.15.2
    ports: ["8787:8787"]
    extra_hosts: ["host.docker.internal:host-gateway"]   # reach native Ollama on the Mac

  objectstore:
    <<: *restart
    profiles: ["core"]
    image: rustfs/rustfs:1.0.2
    environment:
      RUSTFS_ACCESS_KEY: ${OBJECT_STORE_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${OBJECT_STORE_SECRET_KEY:-rustfsadmin}
    ports: ["9000:9000", "9001:9001"]
    volumes: [object-data:/data]

  agent:
    <<: *restart
    profiles: ["app"]
    build: { context: ., dockerfile: docker/agent/Dockerfile }
    env_file: [.env]
    environment:
      DECKSMITH_POSTGRES_DSN: postgresql://decksmith:${POSTGRES_PASSWORD:-decksmith}@postgres:5432/decksmith
      DECKSMITH_MLFLOW_TRACKING_URI: http://mlflow:5000
      DECKSMITH_PORTKEY_BASE_URL: http://portkey:8787
      DECKSMITH_UC_OSS_URL: http://unitycatalog:8080
      DECKSMITH_DUCKDB_PATH: /app/data/lakehouse.duckdb
      DECKSMITH_OUTPUT_DIR: /app/out
    ports: ["8000:8000"]
    volumes: ["./data:/app/data:ro", "./out:/app/out"]

  ui:
    <<: *restart
    profiles: ["app"]
    build: { context: ., dockerfile: docker/agent/Dockerfile }
    command: ["streamlit", "run", "src/decksmith/interfaces/ui.py", "--server.port=8501", "--server.address=0.0.0.0"]
    environment: { DECKSMITH_API_URL: "http://agent:8000" }
    ports: ["8501:8501"]
    depends_on: [agent]

volumes:
  pg-data:
  mlflow-artifacts:
  object-data:
