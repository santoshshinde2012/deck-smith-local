[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "deck-smith-local"
version = "0.2.0"
description = "DeckSmith on a laptop: a Databricks-shaped local stack for the PowerPoint agent (ports and adapters)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Santosh Shinde" }]
dependencies = [
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "langgraph>=1.0",
  "langgraph-checkpoint-postgres>=3.0",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "mlflow>=3.4",
  "python-pptx>=1.0.2",
  "duckdb>=1.1",
  "pyarrow>=17",
  "sqlglot>=26",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "openai>=1.40",
  "pyjwt>=2.9",
]

[project.optional-dependencies]
ui = ["streamlit>=1.38"]
publish = ["boto3>=1.34"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "pre-commit>=3.8", "pip-audit>=2.7"]

[tool.hatch.build.targets.wheel]
packages = ["src/decksmith"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --cov=decksmith --cov-report=term-missing:skip-covered --cov-report=xml --cov-fail-under=90"
markers = [
  "e2e: end-to-end scenarios E1-E11 (fake LLM, offline)",
  "integration: needs the seeded DuckDB lakehouse",
  "stack: needs `make up` (Docker services); skipped otherwise",
]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]

[tool.coverage.run]
branch = true
source = ["decksmith"]
omit = ["src/decksmith/interfaces/ui.py", "src/decksmith/seed/publish.py"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "SLF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["SLF001"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
files = ["src/decksmith", "tests"]
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = false
ignore_missing_imports = true
disallow_untyped_decorators = false
